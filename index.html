<!DOCTYPE html>
<html>
<head>
  <title>Grape Collector</title>
  <style>
    body { margin: 0; background: #222; color: white; font-family: sans-serif; }
    canvas { display: block; margin: auto; background: #333; }
  </style>
</head>
<body>
<canvas id="game" width="600" height="400"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = { x: 300, y: 350, width: 40, height: 40, speed: 5 };
let grapes = [];
let score = 0;
let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function spawnGrape() {
  grapes.push({
    x: Math.random() * 560,
    y: -20,
    size: 20,
    speed: 3
  });
}

setInterval(spawnGrape, 800);

function update() {
  if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
  if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;

  grapes.forEach((g, i) => {
    g.y += g.speed;

    // collision
    if (
      g.x < player.x + player.width &&
      g.x + g.size > player.x &&
      g.y < player.y + player.height &&
      g.y + g.size > player.y
    ) {
      score++;
      grapes.splice(i, 1);
    }

    // remove off-screen grapes
    if (g.y > canvas.height) grapes.splice(i, 1);
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // player
  ctx.fillStyle = "cyan";
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // grapes
  ctx.fillStyle = "purple";
  grapes.forEach(g => {
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.size / 2, 0, Math.PI * 2);
    ctx.fill();
  });

  // score
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 25);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
